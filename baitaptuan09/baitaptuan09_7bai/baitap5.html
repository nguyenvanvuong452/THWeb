<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <input id="txt" type="text" placeholder="Nhap">
    <button id="btn">Kiem tra</button>
    <p id="result"></p>
    <script>
        $("#btn").on("click",()=>{
           var regex = $("#txt").val()
        var pattern = /^\S+\@\S+\.\S+$/
        if(pattern.test(regex)){
            $("#result").text("Dung")
        }
        else{
            $("#result").text("Sai")
        } 
        })
        
    </script>
</body>
</html>
