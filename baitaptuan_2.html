<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container {
        display: grid;
        grid-template-areas: "header " "menu " "content" "footer ";
        grid-template-columns: 1fr 3fr;
        gap: 3px;
        padding: 5px;
    }
    
    .container div {
        background-color: white;
        padding: 10px;
    }
    
    .container div.header {
        grid-area: header;
        text-align: center;
    }
    
    .container div.menu {
        grid-area: menu;
    }
    
    .container div.content {
        grid-area: content;
    }
    
    .container div.footer {
        grid-area: footer;
        text-align: center;
    }
    
    #header {
        display: flex;
        justify-content: space-between;
    }
    
    li {
        display: inline-block;
    }
</style>

<body>
    <div class="container">
        <div id="header" class="header">
            <div>
                <img src="./Group.png" alt="">
                <img src="./SearchEngine.png" alt="">
            </div>
            <div>
                <ul>
                    <li>Images</li>
                    <li>Videos</li>
                    <li>Shopping</li>
                    <li>News</li>
                </ul>
                <div>
                    <img src="./Avatar 2.png" alt="">
                    <img src="./Chevron down large 3.png" alt="">
                </div>
            </div>
</body>

</html>
